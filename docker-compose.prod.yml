services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/bagus-devlab/skc-revisi:latest
    container_name: skc-app
    restart: unless-stopped
    volumes:
      - public-data:/var/www/public
      - ./storage:/var/www/storage
      - ./database:/var/www/database
    env_file:
      - .env
    expose:
      - "9000"
    networks:
      - app_network
    depends_on:
      db:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: skc-web
    restart: unless-stopped
    ports:
      # Bind only to localhost. Point Nginx Proxy Manager to 127.0.0.1:${APP_HTTP_PORT}.
      - "${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8091}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - public-data:/var/www/public:ro
      - ./storage/app/public:/var/www/storage/app/public:ro
    depends_on:
      - app
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: mysql:8.0
    container_name: skc-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "${DB_USERNAME}", "-p${DB_PASSWORD}"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  app_network:
    driver: bridge

volumes:
  public-data:
    driver: local
  mysql-data:
    driver: local
